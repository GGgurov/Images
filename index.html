<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Stream Widget</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}

#container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

img {
  max-width: 100%;
  max-height: 100%;
}

/* ЭФФЕКТЫ */

.glow { animation: glow 2s infinite alternate; }
@keyframes glow {
  from { filter: drop-shadow(0 0 5px white); }
  to { filter: drop-shadow(0 0 25px white); }
}

.pulse { animation: pulse 1.5s infinite; }
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.hue { animation: hue 4s linear infinite; }
@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

.float { animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* UI */

#controls {
  position: fixed;
  top: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 12px;
  border-radius: 10px;
  color: white;
  font-family: sans-serif;
  z-index: 10;
}

button { margin: 3px; cursor: pointer; }

input { margin-top: 5px; width: 260px; }
</style>
</head>

<body>

<div id="container">
  <img id="img" />
</div>

<div id="controls">
  <input type="file" id="file"><br>
  <button onclick="upload()">Загрузить</button>

  <br><br>

  <button onclick="setEffect('')">Нет</button>
  <button onclick="setEffect('glow')">Glow</button>
  <button onclick="setEffect('pulse')">Pulse</button>
  <button onclick="setEffect('hue')">RGB</button>
  <button onclick="setEffect('float')">Float</button>

  <br><br>

  <input id="url" placeholder="Ссылка появится тут">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ТВОЙ FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDuxR5hsWmfIWrjgrsU4zVEnIVppUZxNNU",
  authDomain: "tt-widget-88711.firebaseapp.com",
  projectId: "tt-widget-88711",
  storageBucket: "tt-widget-88711.firebasestorage.app",
};

const app = initializeApp(firebaseConfig);
const storage = getStorage(app);

const img = document.getElementById("img");
const fileInput = document.getElementById("file");
const urlInput = document.getElementById("url");

/* ЗАГРУЗКА */
window.upload = async () => {
  try {
    const file = fileInput.files[0];
    if (!file) {
      alert("Выбери файл");
      return;
    }

    const path = 'images/' + Date.now() + '_' + file.name;
    const storageRef = ref(storage, path);

    console.log("Загрузка...");
    const snapshot = await uploadBytes(storageRef, file);

    const url = await getDownloadURL(snapshot.ref);

    console.log("Готово:", url);

    img.src = url;
    urlInput.value = url;

    // сразу даём ссылку для OBS
    const obsLink = window.location.origin + window.location.pathname +
      "?img=" + encodeURIComponent(url);

    urlInput.value = obsLink;

  } catch (e) {
    console.error(e);
    alert("Ошибка. Открой F12 → Console");
  }
};

/* ЭФФЕКТ */
window.setEffect = (effect) => {
  img.className = effect;
};

/* РЕЖИМ OBS */
const params = new URLSearchParams(window.location.search);
const imageUrl = params.get("img");
const effect = params.get("effect");

if (imageUrl) {
  img.src = imageUrl;
  document.getElementById("controls").style.display = "none";
}

if (effect) {
  img.className = effect;
}
</script>

</body>
</html>
