<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Overlay Widget</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  font-family: Inter, sans-serif;
}

/* КАРТИНКА */
#stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

img {
  max-width: 100%;
  max-height: 100%;
}

/* ЭФФЕКТЫ */
.glow { animation: glow 2s infinite alternate; }
@keyframes glow {
  from { filter: drop-shadow(0 0 5px #fff); }
  to { filter: drop-shadow(0 0 30px #fff); }
}

.pulse { animation: pulse 1.6s infinite; }
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.hue { animation: hue 5s linear infinite; }
@keyframes hue {
  from { filter: hue-rotate(0deg); }
  to { filter: hue-rotate(360deg); }
}

.float { animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* UI */
#ui {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: rgba(20,20,20,0.8);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 16px;
  color: white;
  width: 280px;
}

input, select, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #4f46e5;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="stage">
  <img id="img">
</div>

<div id="ui">
  <input type="file" id="file" accept="image/png">

  <select id="effect">
    <option value="">Без эффекта</option>
    <option value="glow">Glow</option>
    <option value="pulse">Pulse</option>
    <option value="hue">RGB</option>
    <option value="float">Float</option>
  </select>

  <button onclick="generate()">Создать ссылку</button>

  <input id="result" placeholder="Ссылка появится здесь">
</div>

<script>
const img = document.getElementById("img");

function generate() {
  const file = document.getElementById("file").files[0];
  const effect = document.getElementById("effect").value;

  if (!file) {
    alert("Выбери PNG");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    const base64 = e.target.result;

    const url = location.origin + location.pathname +
      "?img=" + encodeURIComponent(base64) +
      "&effect=" + effect;

    document.getElementById("result").value = url;

    img.src = base64;
    img.className = effect;
  };

  reader.readAsDataURL(file);
}

/* OBS режим */
const params = new URLSearchParams(location.search);

if (params.get("img")) {
  img.src = params.get("img");
  img.className = params.get("effect") || "";
  document.getElementById("ui").style.display = "none";
}
</script>

</body>
</html>
