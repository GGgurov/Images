<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Image Widget</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&display=swap');

        /* Общие стили */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Unbounded', sans-serif;
            color: #fff;
            overflow: hidden; /* Для виджета убираем скролл */
        }

        /* --- СТИЛИ ДЛЯ АДМИНКИ --- */
        #admin-panel {
            display: none;
            background-color: #0f0f13;
            min-height: 100vh;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: #1c1c24;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            text-align: center;
            color: #a855f7; /* Акцентный пурпурный */
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 14px;
            color: #aaa;
        }

        input[type="file"], select {
            background: #0f0f13;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Unbounded', sans-serif;
            outline: none;
        }

        button {
            background: #a855f7;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s ease;
        }

        button:hover {
            background: #9333ea;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #4ade80;
        }

        .link-box {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            word-break: break-all;
            border: 1px dashed #555;
        }

        /* --- СТИЛИ ДЛЯ ВИДЖЕТА OBS --- */
        #widget-view {
            display: none;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #stream-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: all 0.5s ease;
        }

        /* --- АНИМАЦИИ --- */
        .anim-none { animation: none; }
        
        .anim-float {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .anim-glow {
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4)); }
            to { filter: drop-shadow(0 0 30px rgba(168, 85, 247, 0.9)); }
        }

        .anim-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .anim-hue {
            animation: hueRotate 5s linear infinite;
        }
        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .anim-liquid {
            animation: liquid 4s ease-in-out infinite;
        }
        @keyframes liquid {
            0% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
            25% { transform: translateY(-10px) scale(1.02) rotate(2deg); filter: drop-shadow(0 15px 25px rgba(255,255,255,0.2)); }
            75% { transform: translateY(5px) scale(0.98) rotate(-2deg); filter: drop-shadow(0 5px 15px rgba(255,255,255,0.1)); }
            100% { transform: translateY(0) scale(1) rotate(0deg); filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
        }
    </style>
</head>
<body>

    <!-- Админ панель -->
    <div id="admin-panel">
        <div class="container">
            <h1>Управление виджетом</h1>
            <div class="form-group">
                <label>1. Выбери прозрачный PNG:</label>
                <input type="file" id="file-input" accept="image/png">
            </div>
            
            <div class="form-group">
                <label>2. Выбери эффект переливания:</label>
                <select id="anim-select">
                    <option value="anim-none">Статично (Без эффектов)</option>
                    <option value="anim-float">Левитация (Плавный полет)</option>
                    <option value="anim-glow">Неоновое свечение</option>
                    <option value="anim-pulse">Пульсация (Бит)</option>
                    <option value="anim-hue">Смена цветов (RGB переливание)</option>
                    <option value="anim-liquid">Жидкое стекло (Мягкое искажение и объем)</option>
                </select>
            </div>

            <button id="upload-btn">Обновить на стриме</button>
            <div id="status"></div>

            <div class="form-group" style="margin-top: 20px;">
                <label>Ссылка для OBS (Вставь в Browser Source):</label>
                <div class="link-box" id="obs-link">Ссылка появится после загрузки...</div>
            </div>
        </div>
    </div>

    <!-- Виджет для OBS -->
    <div id="widget-view">
        <img id="stream-img" src="" alt="" class="anim-none">
    </div>

    <!-- Подключаем Firebase v10 Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref as dbRef, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

        // Твои конфиги
        const firebaseConfig = {
            apiKey: "AIzaSyDuxR5hsWmfIWrjgrsU4zVEnIVppUZxNNU",
            authDomain: "tt-widget-88711.firebaseapp.com",
            databaseURL: "https://tt-widget-88711-default-rtdb.firebaseio.com",
            projectId: "tt-widget-88711",
            storageBucket: "tt-widget-88711.firebasestorage.app",
            messagingSenderId: "997435022478",
            appId: "1:997435022478:web:a0ad462f2a7dd074d27ddf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Проверяем режим работы по URL
        const urlParams = new URLSearchParams(window.location.search);
        const isWidget = urlParams.get('mode') === 'widget';

        const adminPanel = document.getElementById('admin-panel');
        const widgetView = document.getElementById('widget-view');
        const streamImg = document.getElementById('stream-img');

        // Путь в базе данных Firebase
        const widgetDbPath = 'stream/currentWidget';

        if (isWidget) {
            // --- РЕЖИМ OBS ---
            adminPanel.style.display = 'none';
            widgetView.style.display = 'flex';
            document.body.style.backgroundColor = 'transparent'; // Прозрачный фон для OBS

            // Слушаем изменения в реальном времени
            const starCountRef = dbRef(db, widgetDbPath);
            onValue(starCountRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.url) streamImg.src = data.url;
                    if (data.animation) streamImg.className = data.animation;
                }
            });

        } else {
            // --- РЕЖИМ АДМИНКИ ---
            adminPanel.style.display = 'flex';
            widgetView.style.display = 'none';

            // Генерируем ссылку для OBS заранее
            const obsUrl = window.location.href.split('?')[0] + '?mode=widget';
            document.getElementById('obs-link').innerText = obsUrl;

            const uploadBtn = document.getElementById('upload-btn');
            const fileInput = document.getElementById('file-input');
            const animSelect = document.getElementById('anim-select');
            const statusDiv = document.getElementById('status');

            uploadBtn.addEventListener('click', async () => {
                const file = fileInput.files[0];
                const selectedAnim = animSelect.value;

                try {
                    uploadBtn.disabled = true;
                    let downloadURL = null;

                    if (file) {
                        statusDiv.innerText = "Загружаем картинку...";
                        statusDiv.style.color = "#a855f7";
                        
                        // Загружаем в Storage
                        const imageRef = storageRef(storage, 'widget-images/' + file.name);
                        await uploadBytes(imageRef, file);
                        downloadURL = await getDownloadURL(imageRef);
                    }

                    statusDiv.innerText = "Обновляем базу данных...";

                    // Обновляем Realtime Database
                    // Если картинку не выбрали, меняем только анимацию
                    const updateData = { animation: selectedAnim };
                    if (downloadURL) {
                        updateData.url = downloadURL;
                    }

                    // Читаем текущие данные, чтобы не затереть URL, если меняем только анимацию
                    onValue(dbRef(db, widgetDbPath), (snapshot) => {
                         const currentData = snapshot.val() || {};
                         const finalData = {
                             url: downloadURL || currentData.url || "",
                             animation: selectedAnim
                         };
                         set(dbRef(db, widgetDbPath), finalData).then(() => {
                            statusDiv.innerText = "Готово! Виджет на стриме обновлен.";
                            statusDiv.style.color = "#4ade80";
                            uploadBtn.disabled = false;
                         });
                    }, { onlyOnce: true });

                } catch (error) {
                    console.error("Ошибка:", error);
                    statusDiv.innerText = "Ошибка: " + error.message;
                    statusDiv.style.color = "#ef4444";
                    uploadBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
